name: Build polyiphone IPA

on: [workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: build-polyiphone
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_TEMPLATE_TAG: "4.7.2.stable"
  IOS_DIR: ${{ github.workspace }}/build/ios

jobs:
  build-ios:
    runs-on: macos-15-intel
    timeout-minutes: 240
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Register PolyTouchControls Safely
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "Polytoria/scripts/Mobile/PolyTouchControls.cs" ]; then
            echo "::error::Polytoria/scripts/Mobile/PolyTouchControls.cs not found!"
            exit 1
          fi
          sed -i '' '/PolyTouchControls=/d' Polytoria/project.godot
          if ! grep -q '^\[autoload\]' Polytoria/project.godot; then
            printf '\n[autoload]\n' >> Polytoria/project.godot
          fi
          awk '/^\[autoload\]/ { print; print "PolyTouchControls=\"*res://scripts/Mobile/PolyTouchControls.cs\""; next } { print }' \
            Polytoria/project.godot > Polytoria/project.godot.tmp
          mv Polytoria/project.godot.tmp Polytoria/project.godot
          grep -A 5 '^\[autoload\]' Polytoria/project.godot

      - name: Patch Loading Screen (no "Waiting for server" screen)
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/patch_loading_screen.py Polytoria/scripts/client/ui/UILoadingScreen.cs
          if grep -rn "Waiting for server" Polytoria --include=*.cs --include=*.tscn; then
            echo "::error::'Waiting for server' text is still present"
            exit 1
          fi

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Godot 4 (.NET Templates & Glue)
        uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.2
          use-dotnet: true
          include-templates: true

      - name: Cache Patched Godot 4.7.2 Editor
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/patched-godot
          key: godot-4.7.2-ios-csharp-macos-v3

      - name: Checkout Godot 4.7.2 Source
        if: steps.cache-godot.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: 4.7.2-stable
          path: godot-src

      - name: Build Patched Godot 4.7.2 Editor (Bypass C# iOS Block)
        if: steps.cache-godot.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew install scons
          mv godot-src /tmp/godot-src
          python3 - <<'PY'
          import glob

          needle = "Exporting to an Apple Embedded platform is not supported"
          patched = []
          for p in glob.glob("/tmp/godot-src/**/*.py", recursive=True):
              with open(p, encoding="utf-8", errors="ignore") as f:
                  lines = f.read().splitlines(True)
              kept = [l for l in lines if needle not in l]
              if len(kept) != len(lines):
                  with open(p, "w", encoding="utf-8") as f:
                      f.writelines(kept)
                  patched.append(p)
          print("Patched files:", patched or "none (check is not in a .py file)")
          PY
          cd /tmp/godot-src
          scons platform=macos arch=x86_64 target=editor module_mono_enabled=yes vulkan=no angle=no accesskit=no -j"$(sysctl -n hw.ncpu)"
          ./bin/godot.macos.editor.x86_64.mono --headless --generate-mono-glue modules/mono/glue
          python3 modules/mono/build_scripts/build_assemblies.py --godot-output-dir=./bin --godot-platform=macos
          mkdir -p ~/patched-godot
          cp -r ./bin/* ~/patched-godot/

      - name: Restore and Build C# Assembly
        shell: bash
        run: |
          set -euo pipefail
          CSPROJ=$(find Polytoria -name "*.csproj" | head -n 1 || true)
          if [ -z "$CSPROJ" ]; then
            echo "::error::No .csproj found under Polytoria"
            exit 1
          fi
          dotnet restore "$CSPROJ"
          dotnet build "$CSPROJ" -c Release -p:DefineConstants="ALLOW_SELFHOST"

      - name: Export Godot Pack
        shell: bash
        run: |
          set -euo pipefail
          GODOT_BIN="$HOME/patched-godot/godot.macos.editor.x86_64.mono"
          chmod +x "$GODOT_BIN"

          mkdir -p "$IOS_DIR"

          # The iOS project has to be named polyiphone.xcodeproj, so the plugins
          # that need the full iOS exporter are dropped before importing.
          sed -i '' -e '/PolytoriaExportPlugin/d' -e '/DeeplinkPlugin/d' Polytoria/project.godot

          "$GODOT_BIN" --headless --path Polytoria --import
          "$GODOT_BIN" --headless --verbose --path Polytoria --export-pack "iOS" "$IOS_DIR/godot_apple_embedded.pck"
          test -f "$IOS_DIR/godot_apple_embedded.pck" || {
            echo "::error::Godot did not generate godot_apple_embedded.pck"
            exit 1
          }

      - name: Prepare Xcode Project From Template
        shell: bash
        run: |
          set -euo pipefail

          TPL_ZIP=""
          for d in "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_TAG}.mono" \
                   "$HOME/Library/Application Support/Godot/export_templates/${GODOT_TEMPLATE_TAG}"; do
            if [ -f "$d/ios.zip" ]; then TPL_ZIP="$d/ios.zip"; break; fi
          done
          if [ -z "$TPL_ZIP" ]; then
            echo "::error::ios.zip not found in the Godot export templates directory"
            ls -la "$HOME/Library/Application Support/Godot/export_templates/" || true
            exit 1
          fi
          echo "Using $TPL_ZIP"

          rm -rf /tmp/ios_tpl
          mkdir -p /tmp/ios_tpl
          unzip -q "$TPL_ZIP" -d /tmp/ios_tpl

          TPL_PROJ=$(find /tmp/ios_tpl -maxdepth 2 -name "*.xcodeproj" | head -n 1 || true)
          if [ -z "$TPL_PROJ" ]; then
            echo "::error::No .xcodeproj inside ios.zip"
            find /tmp/ios_tpl -maxdepth 3 | head -n 80 || true
            exit 1
          fi
          TPL_ROOT=$(dirname "$TPL_PROJ")

          # Copy everything, dotfiles included, without clobbering the pck.
          cp -R "$TPL_ROOT"/. "$IOS_DIR"/

          if [ -d "$IOS_DIR/godot_apple_embedded.xcodeproj" ] && [ ! -d "$IOS_DIR/polyiphone.xcodeproj" ]; then
            mv "$IOS_DIR/godot_apple_embedded.xcodeproj" "$IOS_DIR/polyiphone.xcodeproj"
          fi
          test -d "$IOS_DIR/polyiphone.xcodeproj"

          python3 "$GITHUB_WORKSPACE/.github/scripts/fill_ios_template.py" "$IOS_DIR"

          # The engine library: pick the iOS *release* xcframework explicitly.
          # Never pick MoltenVK or the debug build by accident.
          echo "xcframeworks shipped in ios.zip:"
          find /tmp/ios_tpl -maxdepth 3 -name "*.xcframework" -print

          FOUND_XCFW=""
          for pat in "libgodot.ios.release.xcframework" \
                     "libgodot.ios.template_release.xcframework" \
                     "*ios*release*.xcframework"; do
            FOUND_XCFW=$(find /tmp/ios_tpl -maxdepth 3 -type d -name "$pat" ! -iname "*moltenvk*" ! -iname "*debug*" | head -n 1 || true)
            if [ -n "$FOUND_XCFW" ]; then break; fi
          done
          if [ -z "$FOUND_XCFW" ]; then
            echo "::error::No iOS release .xcframework found in ios.zip"
            exit 1
          fi
          echo "Using engine library: $FOUND_XCFW"
          rm -rf "$IOS_DIR/godot_apple_embedded.xcframework"
          cp -R "$FOUND_XCFW" "$IOS_DIR/godot_apple_embedded.xcframework"

          xcodebuild -list -project "$IOS_DIR/polyiphone.xcodeproj"

      # WKWebView browser + polytoria:// hand-off used by PolyTouchControls.cs.
      # Non-fatal: if it fails to compile the IPA is still built (with a warning).
      - name: Build Native iOS Bridge
        id: native
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          cd "$IOS_DIR"
          xcrun --sdk iphoneos clang \
            -arch arm64 -miphoneos-version-min=15.0 \
            -fobjc-arc -O2 -Wall \
            -c "$GITHUB_WORKSPACE/.github/native/polyiphone_native.m" \
            -o polyiphone_native.o
          xcrun libtool -static -o libpolyiphone_native.a polyiphone_native.o
          xcrun lipo -info libpolyiphone_native.a
          nm -gU libpolyiphone_native.a | grep -E "poly_(show|hide)_polydroid_web|poly_pop_deeplink"

      - name: Warn If Native Bridge Failed
        if: steps.native.outcome != 'success'
        shell: bash
        run: echo "::warning::Native iOS bridge failed to build; the in-app Polytoria browser will fall back to Safari."

      - name: Compile iOS Binary (goes inside the IPA)
        shell: bash
        env:
          NATIVE_OK: ${{ steps.native.outcome == 'success' }}
        run: |
          set -euo pipefail
          cd "$IOS_DIR"

          test -d godot_apple_embedded.xcframework
          test -f godot_apple_embedded.pck

          # Link the native bridge (and WebKit) only when it was built.
          LD_EXTRA='$(inherited)'
          if [ "$NATIVE_OK" = "true" ] && [ -f "$IOS_DIR/libpolyiphone_native.a" ]; then
            LD_EXTRA="$LD_EXTRA -framework WebKit -framework UIKit -Wl,-u,_poly_show_polydroid_web -Wl,-u,_poly_hide_polydroid_web -Wl,-u,_poly_pop_deeplink $IOS_DIR/libpolyiphone_native.a"
          fi
          echo "OTHER_LDFLAGS=$LD_EXTRA"

          # actool needs an app icon set named AppIcon; write one into every
          # asset catalog of the project.
          python3 "$GITHUB_WORKSPACE/.github/scripts/make_app_icon.py" "$PWD"

          rm -rf build_out Payload polyiphone.ipa
          mkdir -p "$GITHUB_WORKSPACE/build"

          xcodebuild build \
            -project polyiphone.xcodeproj \
            -alltargets \
            -configuration Release \
            -sdk iphoneos \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CONFIGURATION_BUILD_DIR="$PWD/build_out" \
            ASSETCATALOG_COMPILER_APPICON_NAME=AppIcon \
            OTHER_LDFLAGS="$LD_EXTRA" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            2>&1 | tee "$GITHUB_WORKSPACE/build/xcodebuild.log"

      - name: Package Unsigned IPA
        shell: bash
        run: |
          set -euo pipefail
          cd "$IOS_DIR"

          APP_PATH=$(find build_out -maxdepth 1 -name "*.app" -type d | head -n 1 || true)
          if [ -z "$APP_PATH" ]; then
            echo "::error::No .app produced in build_out"
            ls -la build_out || true
            exit 1
          fi

          cp godot_apple_embedded.pck "$APP_PATH/"
          rm -rf "$APP_PATH/_CodeSignature"

          # Sanity checks: the executable exists and is arm64.
          EXE_NAME=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP_PATH/Info.plist")
          test -f "$APP_PATH/$EXE_NAME"
          lipo -info "$APP_PATH/$EXE_NAME" | tee /tmp/lipo.txt
          grep -q arm64 /tmp/lipo.txt

          rm -rf Payload
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          rm -f polyiphone.ipa
          zip -qry polyiphone.ipa Payload
          rm -rf Payload

          unzip -tq polyiphone.ipa
          # Write the listing to a file first: piping unzip into head under
          # pipefail kills unzip with SIGPIPE and fails the step with exit 141.
          unzip -l polyiphone.ipa > /tmp/ipa_listing.txt
          head -n 15 /tmp/ipa_listing.txt
          ls -lh polyiphone.ipa

      - name: Upload polyiphone.ipa
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-ipa
          path: build/ios/polyiphone.ipa
          if-no-files-found: error

      - name: Upload Build Logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: polyiphone-build-logs
          path: build/xcodebuild.log
          if-no-files-found: ignore
